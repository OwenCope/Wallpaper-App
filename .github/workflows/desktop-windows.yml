name: Build Windows Desktop

# Builds the Tauri desktop app on Windows.
#  - Push a tag like  desktop-v1.1.0  -> creates a PRE-RELEASE with the installer attached.
#  - Run manually (Actions tab "Run workflow") -> just builds and uploads the installer
#    as a downloadable artifact, without creating any release.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm install

      - name: Build app (and publish prerelease on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a release when triggered by a desktop-v* tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Minecraft Studio — Windows Beta ${{ github.ref_name }}"
          releaseBody: "Automated Windows build of the desktop app. This is a beta/desktop channel build, separate from the official macOS releases."
          prerelease: true

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
